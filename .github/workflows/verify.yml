name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start Firebase Emulators
        run: docker compose up --detach --build emulators

      - name: Run Flutter checks and build
        run: docker compose --profile test run --build --rm flutter-tests

      - name: Run Dart service tests against the Firestore Emulator
        run: docker compose --profile test run --build --rm api-tests

      - name: Start API and Web containers
        run: docker compose up --detach --build --wait api web

      - name: Check local service health
        run: |
          curl --fail http://127.0.0.1:8090/health
          curl --fail --output /dev/null http://127.0.0.1:8081/
          curl --fail --output /dev/null http://127.0.0.1:8081/reveal/fake-token

      - name: Stop containers and remove CI emulator data
        if: always()
        run: docker compose down --volumes --remove-orphans
